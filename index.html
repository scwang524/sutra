<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F5F0E6">
    <title>誦經修心．福慧增長</title>
    
    <!-- 典雅古風與現代易讀字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* 主題一：宣紙暖杏（柔和護眼，預設） */
            --bg-body: #F4EFE6;
            --bg-content: #FAF7F0;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #F0E9DC;
            --text-main: #2A241F;
            --text-sub: #665A4F;
            --text-light: #94877A;
            --border-subtle: #E5DAC9;
            --border-highlight: #C5B39B;
            --accent: #9A2829; /* 朱砂紅 */
            --accent-bg: #F7EAE9;
            --gold: #A07833; /* 沉香金 */
            --gold-bg: #F9F3E5;
            --shadow: 0 4px 20px rgba(60, 48, 32, 0.08);
            --font-size: 24px;
            --line-height: 2.1;
            --letter-spacing: 0.05em;
            --font-family: 'Noto Serif TC', 'Songti TC', serif;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        /* 主題二：沉香夜月（深色夜讀） */
        body.theme-dark {
            --bg-body: #131211;
            --bg-content: #1B1918;
            --bg-card: #24211E;
            --bg-card-subtle: #2C2824;
            --text-main: #DCD3C6;
            --text-sub: #A09688;
            --text-light: #70685D;
            --border-subtle: #302C26;
            --border-highlight: #50483E;
            --accent: #DA756A;
            --accent-bg: #2D1D1B;
            --gold: #D2B580;
            --gold-bg: #2B251C;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* 主題三：青竹靜心（雅緻墨綠） */
        body.theme-bamboo {
            --bg-body: #EAF1E9;
            --bg-content: #F3F8F2;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #E1ECE0;
            --text-main: #1B281E;
            --text-sub: #49604E;
            --text-light: #778F7C;
            --border-subtle: #D2E0D0;
            --border-highlight: #A4BFA1;
            --accent: #29683B;
            --accent-bg: #E4F0E7;
            --gold: #897539;
            --gold-bg: #F5F3E8;
            --shadow: 0 4px 20px rgba(30, 50, 35, 0.08);
        }

        /* 主題四：素雪澄明（極簡雅白） */
        body.theme-moonwhite {
            --bg-body: #F3F4F6;
            --bg-content: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-subtle: #EDEFF2;
            --text-main: #1A1E22;
            --text-sub: #505B66;
            --text-light: #82909E;
            --border-subtle: #DFE3E8;
            --border-highlight: #BEC5CE;
            --accent: #325074;
            --accent-bg: #EAF0F6;
            --gold: #90764A;
            --gold-bg: #F6F3EC;
            --shadow: 0 4px 20px rgba(25, 30, 35, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            user-select: text;
        }

        /* 頂部閱讀進度條 */
        .reading-progress-bar {
            position: fixed;
            top: calc(54px + var(--safe-top));
            left: 0;
            height: 2.5px;
            background: linear-gradient(90deg, var(--gold), var(--accent));
            width: 0%;
            z-index: 102;
            transition: width 0.1s linear;
        }

        /* 頂部主導航欄 */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(54px + var(--safe-top));
            padding-top: var(--safe-top);
            background-color: var(--bg-content);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: calc(10px + var(--safe-left));
            padding-right: calc(10px + var(--safe-right));
            z-index: 100;
            box-shadow: 0 1px 10px rgba(0,0,0,0.03);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }

        /* 標題膠囊按鈕（顯示經典與當前章節品名） */
        .header-title-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            background-color: var(--bg-card-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            transition: all 0.2s ease;
            max-width: 170px;
            min-width: 0;
            flex-shrink: 1;
        }
        .header-title-pill:hover, .header-title-pill:active {
            border-color: var(--border-highlight);
            background-color: var(--bg-card);
        }
        .header-title-pill svg {
            flex-shrink: 0;
        }
        .pill-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .icon-btn {
            background: transparent;
            border: none;
            outline: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .icon-btn:hover, .icon-btn:active {
            background-color: var(--bg-card-subtle);
            color: var(--text-main);
        }
        .icon-btn.active {
            color: var(--accent);
            background-color: var(--accent-bg);
        }

        /* 經典快捷切換欄（橫向滾動膠囊標籤） */
        .scripture-quick-bar {
            position: fixed;
            top: calc(54px + var(--safe-top));
            left: 0;
            right: 0;
            height: 42px;
            background-color: var(--bg-content);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding-left: calc(10px + var(--safe-left));
            padding-right: calc(10px + var(--safe-right));
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            gap: 8px;
            scrollbar-width: none;
            z-index: 90;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }
        .scripture-quick-bar::-webkit-scrollbar {
            display: none;
        }

        .sutra-tab-btn {
            white-space: nowrap;
            padding: 4px 13px;
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-subtle);
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .sutra-tab-btn.active {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(154, 40, 41, 0.25);
        }

        /* 經典區塊 / 品節導航與即時狀態條（全經典通用，滑動時清楚標明當前位置） */
        .scripture-section-bar {
            position: fixed;
            top: calc(96px + var(--safe-top));
            left: 0;
            right: 0;
            height: 38px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding-left: calc(10px + var(--safe-left));
            padding-right: calc(10px + var(--safe-right));
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            z-index: 85;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .scripture-section-bar::-webkit-scrollbar {
            display: none;
        }
        .section-status-prefix {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--accent-bg);
            white-space: nowrap;
            flex-shrink: 0;
            letter-spacing: 0.05em;
        }
        .section-pills-scroll {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            flex: 1;
            padding-right: 10px;
        }
        .section-pills-scroll::-webkit-scrollbar {
            display: none;
        }
        .section-pill-btn {
            font-size: 12px;
            padding: 3px 11px;
            border-radius: 14px;
            cursor: pointer;
            color: var(--text-sub);
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-subtle);
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .section-pill-btn:hover {
            border-color: var(--border-highlight);
            color: var(--text-main);
        }
        .section-pill-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #FFFFFF;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(154, 40, 41, 0.25);
        }

        /* 經文主內容區塊 */
        .reader-container {
            max-width: 720px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-content);
            box-shadow: var(--shadow);
            padding: calc(144px + var(--safe-top)) calc(20px + var(--safe-right)) calc(180px + var(--safe-bottom)) calc(20px + var(--safe-left));
            transition: padding 0.3s ease;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* 經文頂部印記（簡約清淨，去除冗長摘要壓迫感） */
        .scripture-header-art {
            text-align: center;
            padding: 16px 8px 22px 8px;
            border-bottom: 1px dashed var(--border-subtle);
            margin-bottom: 24px;
            position: relative;
        }
        .seal-stamp {
            display: inline-block;
            border: 1.5px solid var(--accent);
            color: var(--accent);
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 4px;
            letter-spacing: 0.2em;
            margin-bottom: 8px;
            background-color: var(--accent-bg);
        }
        .main-sutra-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.1em;
            color: var(--text-main);
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .sutra-subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
        .sutra-blessing-pill {
            display: inline-block;
            font-size: 12px;
            color: var(--gold);
            background: var(--gold-bg);
            padding: 3px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-highlight);
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-top: 4px;
        }
        .sutra-summary-box {
            display: none; /* 隱藏原本長篇大論的文字塊，由各區塊獨立標記 */
        }

        /* 經文區塊卡片化與醒目標示 */
        .chapter-section {
            margin-bottom: 48px;
            position: relative;
            scroll-margin-top: calc(146px + var(--safe-top));
        }
        .chapter-block-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 16px 16px 14px 16px;
            margin: 36px 0 24px 0;
            text-align: center;
            box-shadow: 0 2px 10px rgba(60, 48, 32, 0.04);
            position: relative;
        }
        .chapter-block-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--gold-bg);
            color: var(--gold);
            border: 1px solid var(--border-highlight);
            font-size: 11.5px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 10px;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
        }
        .chapter-heading {
            font-size: calc(var(--font-size) * 1.15);
            font-weight: 800;
            color: var(--accent);
            margin: 4px 0 8px 0;
            letter-spacing: 0.06em;
            line-height: 1.35;
        }
        .chapter-block-decor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--border-highlight);
            font-size: 11px;
        }
        .chapter-block-decor .decor-line {
            height: 1px;
            width: 32px;
            background: linear-gradient(to right, transparent, var(--border-highlight), transparent);
        }
        .chapter-block-footer {
            text-align: center;
            margin: 28px 0 44px 0;
            padding: 8px 0;
            border-top: 1px dashed var(--border-subtle);
            border-bottom: 1px dashed var(--border-subtle);
        }
        .chapter-block-footer span {
            font-size: 12px;
            letter-spacing: 0.12em;
            color: var(--text-light);
            background: var(--bg-card-subtle);
            padding: 3px 14px;
            border-radius: 10px;
        }

        .roll-divider-header {
            text-align: center;
            margin: 44px 0 24px 0;
            padding: 14px;
            background: var(--bg-card-subtle);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            scroll-margin-top: calc(144px + var(--safe-top));
        }
        .roll-divider-header h3 {
            font-size: 19px;
            color: var(--gold);
            letter-spacing: 0.15em;
            margin-bottom: 4px;
        }
        .roll-divider-header p {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* 經文段落文字排版 */
        .sutra-p {
            font-size: var(--font-size);
            line-height: var(--line-height);
            letter-spacing: var(--letter-spacing);
            margin-bottom: 1.25em;
            text-align: justify;
            text-justify: inter-ideograph;
            color: var(--text-main);
            transition: font-size 0.2s ease, line-height 0.2s ease;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* 偈頌/真言/讚文（中央詩律風格） */
        .sutra-verse {
            text-align: center;
            color: var(--text-main);
            font-weight: 500;
            padding: 12px 14px;
            margin: 18px 0;
            background-color: var(--bg-card-subtle);
            border-radius: 8px;
            border-left: 2px solid var(--accent);
            border-right: 2px solid var(--accent);
            line-height: 2.2;
            letter-spacing: 0.1em;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* 罕見字/梵音注音 (Ruby) */
        ruby {
            ruby-position: over;
        }
        rt {
            font-size: 0.58em;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0;
        }
        body.hide-pinyin rt {
            display: none;
        }

        /* 古風直排模式 (Vertical Reading) */
        .reading-vertical {
            overflow-x: auto;
            overflow-y: hidden;
            height: calc(100vh - 120px);
            height: calc(100dvh - 120px);
            max-width: 100vw;
            padding: 14px calc(20px + var(--safe-left));
            margin-top: calc(96px + var(--safe-top));
            direction: rtl; /* 從右向左讀 */
            -webkit-overflow-scrolling: touch;
        }
        body.has-roll-bar .reading-vertical {
            margin-top: calc(132px + var(--safe-top));
            height: calc(100vh - 156px);
            height: calc(100dvh - 156px);
        }
        body.zen-mode .reading-vertical {
            margin-top: calc(20px + var(--safe-top));
            height: calc(100vh - 40px);
            height: calc(100dvh - 40px);
        }
        .reading-vertical #scriptureContentArea {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            height: 100%;
            display: inline-block;
            direction: ltr;
        }
        .reading-vertical .chapter-section {
            display: inline-block;
            vertical-align: top;
            height: 100%;
            margin-left: 32px;
            margin-bottom: 0;
            scroll-margin-top: 0;
        }
        .reading-vertical .sutra-p {
            margin-left: 1.2em;
            margin-bottom: 0;
            height: 85%;
        }

        /* 右下角浮動快捷工具組 */
        .floating-action-cluster {
            position: fixed;
            bottom: calc(20px + var(--safe-bottom));
            right: calc(16px + var(--safe-right));
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 95;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fab-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-highlight);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .fab-btn:active {
            transform: scale(0.92);
        }
        .fab-btn.primary {
            background-color: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
        }
        .fab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: var(--gold);
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 700;
            border-radius: 10px;
            padding: 2px 5px;
            min-width: 18px;
            text-align: center;
        }

        /* 自動滾動控制浮動條 */
        .autoscroll-panel {
            position: fixed;
            bottom: calc(16px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(140%);
            background-color: var(--bg-card);
            border: 1px solid var(--border-highlight);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.15);
            z-index: 96;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: calc(100vw - 32px);
            white-space: nowrap;
        }
        .autoscroll-panel.show {
            transform: translateX(-50%) translateY(0);
        }
        .speed-tag {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            min-width: 30px;
            text-align: center;
        }

        /* 專注沉浸模式（Zen Mode） */
        body.zen-mode .app-header,
        body.zen-mode .scripture-quick-bar,
        body.zen-mode .dizang-roll-bar,
        body.zen-mode .reading-progress-bar,
        body.zen-mode .floating-action-cluster {
            transform: translateY(-120%);
            opacity: 0;
            pointer-events: none;
        }
        body.zen-mode .reader-container {
            padding-top: calc(24px + var(--safe-top));
            padding-bottom: calc(30px + var(--safe-bottom));
        }
        .zen-exit-btn {
            position: fixed;
            top: calc(14px + var(--safe-top));
            right: calc(14px + var(--safe-right));
            background: rgba(40, 34, 28, 0.65);
            backdrop-filter: blur(8px);
            color: #FFFFFF;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            display: none;
            align-items: center;
            gap: 5px;
            z-index: 200;
            cursor: pointer;
        }
        body.zen-mode .zen-exit-btn {
            display: flex;
        }

        
        /* 大字版專屬調整按鈕與膠囊 */
        .font-step-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-highlight);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .font-step-btn:active {
            transform: scale(0.92);
            background: var(--bg-card-subtle);
        }
        .font-presets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .font-preset-pill {
            padding: 6px 3px;
            border-radius: 8px;
            font-size: 12px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card-subtle);
            color: var(--text-sub);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .font-preset-pill:active {
            transform: scale(0.95);
        }
        .font-preset-pill.active {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
            font-weight: 600;
        }

        /* 抽屜模態框 (Drawer) */
        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 150;
        }
        .drawer-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85vh;
            max-height: 85dvh;
            background-color: var(--bg-content);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.25);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 160;
            display: flex;
            flex-direction: column;
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
            padding-bottom: var(--safe-bottom);
        }
        .drawer-panel.open {
            transform: translateY(0);
        }

        .drawer-handle {
            width: 38px;
            height: 4px;
            background: var(--border-highlight);
            border-radius: 2px;
            margin: 10px auto 4px auto;
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .drawer-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .drawer-body {
            overflow-y: auto;
            padding: 16px 18px;
            -webkit-overflow-scrolling: touch;
        }

        /* 目錄項目 */
        .toc-scripture-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .toc-scripture-tabs::-webkit-scrollbar {
            display: none;
        }
        .toc-s-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            background: var(--bg-card-subtle);
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid var(--border-subtle);
        }
        .toc-s-pill.active {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
            font-weight: 600;
        }

        .toc-roll-group {
            margin-bottom: 18px;
        }
        .toc-roll-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toc-item {
            padding: 11px 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            margin-bottom: 7px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .toc-item:active {
            background-color: var(--bg-card-subtle);
            transform: scale(0.99);
        }
        .toc-item.active {
            border-color: var(--accent);
            background-color: var(--accent-bg);
        }
        .toc-item-title {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text-main);
        }
        .toc-item.active .toc-item-title {
            color: var(--accent);
        }
        .toc-item-badge {
            font-size: 11.5px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* 閱讀設定面板 */
        .setting-section {
            margin-bottom: 20px;
        }
        .setting-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 9px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .theme-btn {
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 9px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .theme-btn.active {
            border-color: var(--accent);
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .theme-btn-ricepaper { background: #F4EFE6; color: #2A241F; border-color: #E5DAC9; }
        .theme-btn-dark { background: #1B1918; color: #DCD3C6; border-color: #333; }
        .theme-btn-bamboo { background: #EAF1E9; color: #1B281E; border-color: #D2E0D0; }
        .theme-btn-moonwhite { background: #FFFFFF; color: #1A1E22; border-color: #DFE3E8; }

        .btn-toggle-group {
            display: flex;
            background: var(--bg-card-subtle);
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
        }
        .toggle-btn {
            flex: 1;
            padding: 7px;
            border: none;
            background: transparent;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: var(--bg-card);
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .custom-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: var(--border-subtle);
            border-radius: 3px;
            outline: none;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* 木魚專區 */
        .muyu-container {
            text-align: center;
            padding: 10px 0 16px 0;
        }
        .muyu-wood {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.08s ease;
            position: relative;
        }
        .muyu-wood:active {
            transform: scale(0.92);
        }
        .ripple-text {
            position: fixed;
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            pointer-events: none;
            animation: floatUp 0.85s ease-out forwards;
            z-index: 999;
            text-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -45px) scale(1.3); }
        }

        .muyu-count-badge {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            font-family: var(--font-family);
            margin: 10px 0 2px 0;
        }
        .muyu-sub-text {
            font-size: 12.5px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        /* 經文關鍵字搜尋欄 (固定在頂部導航下方) */
        .search-bar-modal {
            position: fixed;
            top: calc(54px + var(--safe-top));
            left: 0;
            right: 0;
            display: none;
            padding: 8px 12px;
            padding-left: calc(12px + var(--safe-left));
            padding-right: calc(12px + var(--safe-right));
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            align-items: center;
            gap: 8px;
            z-index: 99;
            transition: all 0.25s ease;
        }
        .search-bar-modal.show {
            display: flex;
        }
        .search-input {
            flex: 1;
            min-width: 0;
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid var(--border-highlight);
            background: var(--bg-content);
            color: var(--text-main);
            outline: none;
            font-size: 14px;
        }
        .search-match-badge {
            font-size: 12px;
            color: var(--text-sub);
            white-space: nowrap;
            flex-shrink: 0;
        }
        mark.sutra-highlight {
            background-color: #FFE58F;
            color: #262626;
            padding: 1px 3px;
            border-radius: 2px;
        }

        /* Toast 輕提示 */
        .app-toast {
            position: fixed;
            top: calc(66px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(36, 30, 26, 0.92);
            color: #FFFFFF;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: all 0.28s ease;
            z-index: 300;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            max-width: calc(100vw - 32px);
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }
        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 手機版與各尺寸螢幕響應式適配 (Mobile Responsive) */
        @media (max-width: 600px) {
            .app-header {
                padding-left: calc(6px + var(--safe-left));
                padding-right: calc(6px + var(--safe-right));
            }
            .header-left {
                gap: 2px;
            }
            .header-right {
                gap: 2px;
            }
            .header-title-pill {
                max-width: 145px;
                padding: 4px 8px;
                font-size: 12.5px;
                gap: 4px;
            }
            .icon-btn {
                width: 33px;
                height: 33px;
            }
            .dizang-roll-bar {
                justify-content: flex-start;
                padding-left: calc(8px + var(--safe-left));
                padding-right: calc(8px + var(--safe-right));
                gap: 6px;
            }
            .roll-tab-pill {
                font-size: 11.5px;
                padding: 3px 8px;
            }
            .reader-container {
                padding-left: calc(14px + var(--safe-left));
                padding-right: calc(14px + var(--safe-right));
                padding-top: calc(104px + var(--safe-top));
                padding-bottom: calc(170px + var(--safe-bottom));
            }
            body.has-roll-bar .reader-container {
                padding-top: calc(140px + var(--safe-top));
            }
            .main-sutra-title {
                font-size: 22px;
            }
            .sutra-subtitle {
                font-size: 12.5px;
            }
            .sutra-summary-box {
                font-size: 12.5px;
                padding: 8px 12px;
                max-width: 100%;
            }
            .chapter-heading {
                font-size: calc(var(--font-size) * 1.08);
                margin: 28px 0 16px 0;
            }
            .floating-action-cluster {
                right: calc(12px + var(--safe-right));
                bottom: calc(14px + var(--safe-bottom));
                gap: 8px;
            }
            .fab-btn {
                width: 44px;
                height: 44px;
            }
            .drawer-panel {
                max-height: 88vh;
                max-height: 88dvh;
            }
            .drawer-body {
                padding: 14px 14px;
            }
            .theme-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .font-presets-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
            }
            .font-preset-pill {
                font-size: 11.5px;
                padding: 6px 2px;
            }
        }

        /* 針對更窄小螢幕 (如 iPhone SE, 360px 寬度手機) */
        @media (max-width: 380px) {
            .app-header {
                padding-left: calc(4px + var(--safe-left));
                padding-right: calc(4px + var(--safe-right));
            }
            .header-title-pill {
                max-width: 118px;
                font-size: 11.5px;
                padding: 3px 6px;
            }
            .icon-btn {
                width: 31px;
                height: 31px;
            }
            .header-right {
                gap: 1px;
            }
            .font-presets-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="theme-ricepaper has-roll-bar">
    <!-- 頂部進度條 -->
