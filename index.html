    <!-- 應用核心互動腳本 -->
    <script>
        const state = {
            currentSutraId: 'dizang',
            currentChapterTitle: '',
            drawerSutraId: 'dizang',
            theme: 'theme-ricepaper',
            fontSize: 24,
            lineHeight: 2.1,
            layout: 'horizontal',
            fontFamily: 'serif',
            isZenMode: false,
            isAutoScrolling: false,
            scrollSpeed: 2,
            autoScrollRafId: null,
            muyuCount: 0,
            autoMuyuTimer: null,
            wakeLock: null,
            showPinyin: true
        };

        // Web Audio API 禪意純音合成器
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 寺廟大木魚 · 物理聲學真實合成器 (沉香木空心腔體共振 + 實木撞擊音)
        function playWoodenFishSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // 自然手敲微幅律動 (頻率微漂移 ±1.5%，避免機器重複感)
                const pitchJitter = 1 + (Math.random() * 0.03 - 0.015);
                const baseFreq = 328 * pitchJitter; // 沉香大木魚沉穩基頻約 328Hz
                const woodHarmonic = baseFreq * 1.68; // 木質側壁二次共鳴約 550Hz

                // 1. 主空心共鳴腔 (Helmholtz 腔體共振，溫潤渾厚的「咚/敻」聲)
                const oscMain = ctx.createOscillator();
                const gainMain = ctx.createGain();
                oscMain.type = 'sine';
                // 搥頭撞擊瞬間自然微小下沉 (僅在 10ms 內沉降 14Hz，模擬實木受力回彈)
                oscMain.frequency.setValueAtTime(baseFreq + 16, now);
                oscMain.frequency.exponentialRampToValueAtTime(baseFreq, now + 0.012);

                gainMain.gain.setValueAtTime(0.85, now);
                gainMain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
                oscMain.connect(gainMain);
                oscMain.start(now);
                oscMain.stop(now + 0.30);

                // 2. 木身硬質泛音 (表現古木殼體的硬質「木質」色調)
                const oscWood = ctx.createOscillator();
                const gainWood = ctx.createGain();
                oscWood.type = 'sine';
                oscWood.frequency.setValueAtTime(woodHarmonic, now);
                gainWood.gain.setValueAtTime(0.35, now);
                gainWood.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                oscWood.connect(gainWood);
                oscWood.start(now);
                oscWood.stop(now + 0.09);

                // 3. 敲擊接觸瞬態 (Mallet Impact Transient，布裹木槌敲擊實木殼時的短促「嗒」實感)
                const bufferSize = Math.floor(ctx.sampleRate * 0.015); // 15ms 瞬態
                const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.22));
                }
                const noiseSrc = ctx.createBufferSource();
                noiseSrc.buffer = noiseBuffer;

                const impactFilter = ctx.createBiquadFilter();
                impactFilter.type = 'bandpass';
                impactFilter.frequency.setValueAtTime(1100, now);
                impactFilter.Q.setValueAtTime(2.2, now);

                const impactGain = ctx.createGain();
                impactGain.gain.setValueAtTime(0.48, now);
                impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

                noiseSrc.connect(impactFilter);
                impactFilter.connect(impactGain);
                noiseSrc.start(now);
                noiseSrc.stop(now + 0.02);

                // 4. 總輸出低通濾波 (消除電子生硬感，帶來古剎禪房的溫暖沉厚感)
                const masterFilter = ctx.createBiquadFilter();
                masterFilter.type = 'lowpass';
                masterFilter.frequency.setValueAtTime(1500, now);

                gainMain.connect(masterFilter);
                gainWood.connect(masterFilter);
                impactGain.connect(masterFilter);

                masterFilter.connect(ctx.destination);

                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            } catch (e) {
                console.warn('Wooden fish audio error:', e);
            }
        }

        // 合成銅磬/頌缽長泛音
        function playSingingBowlSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const freqs = [432, 864, 1296, 1728];
                const weights = [0.6, 0.25, 0.1, 0.05];

                freqs.forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);

                    gain.gain.setValueAtTime(weights[i] * 0.7, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now);
                    osc.stop(now + 3.6);
                });

                showToast('🔔 銅磬引罄 · 淨心沉香');
            } catch (e) {
                console.warn('Bowl sound error:', e);
            }
        }

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadPreferences();
            renderScripture(state.currentSutraId);
            setupScrollListener();
            setupIntersectionObserver();
        });

        // 載入偏好設定
        function loadPreferences() {
            try {
                const savedSutra = localStorage.getItem('sutra_current_id');
                if (savedSutra && SCRIPTURES_DATA[savedSutra]) {
                    state.currentSutraId = savedSutra;
                    state.drawerSutraId = savedSutra;
                }

                const savedTheme = localStorage.getItem('sutra_theme');
                if (savedTheme) setTheme(savedTheme, false);

                const savedSize = localStorage.getItem('sutra_fontsize');
                if (savedSize) { changeFontSize(savedSize, false); } else { changeFontSize(24, false); }

                const savedLh = localStorage.getItem('sutra_lineheight');
                if (savedLh) setLineHeight(savedLh, false);

                const savedLayout = localStorage.getItem('sutra_layout');
                if (savedLayout) setLayout(savedLayout, false);

                const savedFont = localStorage.getItem('sutra_font');
                if (savedFont) setFontFamily(savedFont, false);

                const savedMuyu = localStorage.getItem('sutra_muyu_count');
                if (savedMuyu) {
                    state.muyuCount = parseInt(savedMuyu, 10) || 0;
                    updateMuyuDisplay();
                }

                // 恢復歷史滾動位置
                setTimeout(() => {
                    const savedScroll = localStorage.getItem('sutra_scroll_' + state.currentSutraId);
                    if (savedScroll && parseInt(savedScroll, 10) > 20) {
                        window.scrollTo({ top: parseInt(savedScroll, 10), behavior: 'smooth' });
                        showToast('已為您恢復閱讀進度');
                    }
                }, 350);

            } catch (e) {
                console.error('Failed to load preferences:', e);
            }
        }

        // 渲染經文主體
        function renderScripture(sutraId) {
            const data = SCRIPTURES_DATA[sutraId];
            if (!data) return;

            state.currentSutraId = sutraId;
            state.drawerSutraId = sutraId;
            localStorage.setItem('sutra_current_id', sutraId);

            // 更新 Header 標題與快捷導航
            updateHeaderTitle(data.title);

            document.querySelectorAll('.sutra-tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.sutra === sutraId);
            });

            // 同步更新目錄抽屜（下拉選單）中的標籤選中狀態
            updateTocScripturePills(sutraId);

            // 渲染頂部通用章節區塊膠囊列
            const pillsContainer = document.getElementById('sectionPillsContainer');
            let pillsHtml = '';

            // 組裝 HTML（精簡頂部印記，去除冗長摘要壓迫感）
            let html = `
                <div class="scripture-header-art">
                    <div class="seal-stamp">${data.category || '殊勝經典'}</div>
                    <h1 class="main-sutra-title">${data.title}</h1>
                    <div class="sutra-subtitle">${data.subtitle || ''}</div>
                    <div class="sutra-blessing-pill">❖ 恭敬持誦 · 隨文入觀 · 功德無量 ❖</div>
                </div>
            `;

            if (sutraId === 'dizang') {
                // 地藏經三卷十三品
                data.rolls.forEach((roll, rIdx) => {
                    html += `
                        <div class="roll-divider-header" id="${roll.id}">
                            <h3>❖ ${roll.title} ❖</h3>
                            <p>${roll.desc}</p>
                        </div>
                    `;

                    roll.chapters.forEach(chap => {
                        const badge = getChapterBadge(sutraId, chap, roll.id);
                        const shortName = getChapterShortPillName(sutraId, chap, roll.id);
                        pillsHtml += `<button class="section-pill-btn" id="sec-pill-${chap.id}" onclick="jumpToChapter('${chap.id}')" title="${chap.title}">${shortName}</button>`;

                        html += `
                            <section class="chapter-section" id="${chap.id}" data-title="${chap.title}" data-badge="${badge}" data-roll="${roll.id}">
                                <div class="chapter-block-card">
                                    <div class="chapter-block-badge">${badge}</div>
                                    <h2 class="chapter-heading">${chap.title}</h2>
                                    <div class="chapter-block-decor">
                                        <span class="decor-line"></span>
                                        <span>❖</span>
                                        <span class="decor-line"></span>
                                    </div>
                                </div>
                                <div class="chapter-body">
                                    ${renderParagraphs(chap.paragraphs)}
                                </div>
                                <div class="chapter-block-footer">
                                    <span>❖ ${chap.title} · 讀誦圓滿 ❖</span>
                                </div>
                            </section>
                        `;
                    });
                });
            } else {
                // 其他經典（心經、清靜經、彌勒真經）
                data.chapters.forEach(chap => {
                    const badge = getChapterBadge(sutraId, chap, null);
                    const shortName = getChapterShortPillName(sutraId, chap, null);
                    pillsHtml += `<button class="section-pill-btn" id="sec-pill-${chap.id}" onclick="jumpToChapter('${chap.id}')" title="${chap.title}">${shortName}</button>`;

                    html += `
                        <section class="chapter-section" id="${chap.id}" data-title="${chap.title}" data-badge="${badge}">
                            <div class="chapter-block-card">
                                <div class="chapter-block-badge">${badge}</div>
                                <h2 class="chapter-heading">${chap.title}</h2>
                                <div class="chapter-block-decor">
                                    <span class="decor-line"></span>
                                    <span>❖</span>
                                    <span class="decor-line"></span>
                                </div>
                            </div>
                            <div class="chapter-body">
                                ${renderParagraphs(chap.paragraphs)}
                            </div>
                            <div class="chapter-block-footer">
                                <span>❖ ${chap.title} · 讀誦圓滿 ❖</span>
                            </div>
                        </section>
                    `;
                });
            }

            if (pillsContainer) {
                pillsContainer.innerHTML = pillsHtml;
            }

            document.getElementById('scriptureContentArea').innerHTML = html;

            // 重新刷新目錄
            renderTocDrawer();

            // 重新初始化 IntersectionObserver 監聽
            setTimeout(setupIntersectionObserver, 200);
        }

        // 取得章節品目的莊嚴標籤
        function getChapterBadge(sutraId, chap, rollId) {
            if (sutraId === 'dizang') {
                if (chap.id.includes('c1') || chap.title.includes('前行') || chap.title.includes('爐香讚')) return '前行開經';
                if (chap.id.includes('ending') || chap.title.includes('結行') || chap.title.includes('迴向')) return '圓滿結行';
                let rollName = '卷上';
                if (rollId === 'juan-zhong') rollName = '卷中';
                else if (rollId === 'juan-xia') rollName = '卷下';
                const m = chap.title.match(/第([一二三四五六七八九十百]+)品/) || chap.title.match(/品第([一二三四五六七八九十]+)/);
                if (m) return `${rollName} · 第${m[1]}品`;
                return `${rollName} · 品節正文`;
            }
            if (sutraId === 'xinjing') {
                if (chap.id.includes('intro') || chap.title.includes('開經')) return '前行開經';
                if (chap.id.includes('ending') || chap.title.includes('迴向')) return '圓滿結行';
                return '經文正文';
            }
            if (sutraId === 'qingjing') {
                if (chap.id.includes('intro') || chap.title.includes('神咒')) return '前行淨壇';
                if (chap.id.includes('ending') || chap.title.includes('迴向')) return '圓滿結行';
                const m = chap.title.match(/第([一二三四五]+)章/);
                if (m) return `經文第${m[1]}章`;
                return '仙真論述';
            }
            if (sutraId === 'mile') {
                if (chap.id.includes('intro') || chap.title.includes('開經')) return '前行開經';
                if (chap.id.includes('c1')) return '正文上篇 (1-9段)';
                if (chap.id.includes('c2')) return '正文下篇 (10-18段)';
                if (chap.id.includes('ending') || chap.title.includes('迴向')) return '圓滿結行';
                return '經文段落';
            }
            return '經文區塊';
        }

        // 取得頂部膠囊導航條章節簡稱
        function getChapterShortPillName(sutraId, chap, rollId) {
            if (sutraId === 'dizang') {
                if (chap.title.includes('前行')) return '卷首前行';
                if (chap.title.includes('結行') || chap.title.includes('迴向')) return '圓滿結行';
                const m = chap.title.match(/(.*)品第?([一二三四五六七八九十]+)/);
                if (m) {
                    const num = m[2];
                    const name = m[1].replace(/品$/, '').substring(0, 4);
                    return `${num}品 ${name}`;
                }
                return chap.title.substring(0, 6);
            }
            if (sutraId === 'xinjing') {
                if (chap.title.includes('開經')) return '前行開經';
                if (chap.title.includes('迴向')) return '圓滿迴向';
                return '心經正文';
            }
            if (sutraId === 'qingjing') {
                if (chap.title.includes('神咒')) return '前行神咒';
                if (chap.title.includes('迴向')) return '圓滿迴向';
                const m = chap.title.match(/第([一二三四五]+)章[・\s]*(.*)/);
                if (m) return `${m[1]}章 ${m[2].substring(0, 4)}`;
                return chap.title.substring(0, 6);
            }
            if (sutraId === 'mile') {
                if (chap.title.includes('開經')) return '彌勒開經';
                if (chap.id.includes('c1')) return '正文上篇 (1-9)';
                if (chap.id.includes('c2')) return '正文下篇 (10-18)';
                if (chap.title.includes('迴向')) return '佛號迴向';
                return chap.title.substring(0, 6);
            }
            return chap.title.substring(0, 6);
        }

        // 更新 Header 標題顯示
        function updateHeaderTitle(title) {
            document.getElementById('headerTitleText').textContent = title;
        }

        // 渲染段落並處理注音
        function renderParagraphs(paragraphs) {
            return paragraphs.map(p => {
                const isVerse = p.includes('\n') || p.includes('南無') || p.startsWith('【') || (p.length < 55 && !p.endsWith('。'));
                let formatted = p.replace(/\n/g, '<br>');
                formatted = enrichWithPinyin(formatted);

                if (isVerse) {
                    return `<div class="sutra-verse sutra-p">${formatted}</div>`;
                } else {
                    return `<p class="sutra-p">${formatted}</p>`;
                }
            }).join('');
        }

        // 生僻字與關鍵梵音注音清單
        function enrichWithPinyin(text) {
            const annotations = [
                { word: '忉利', ruby: '<ruby>忉<rt>ㄉㄠ</rt></ruby><ruby>利<rt>ㄌㄧˋ</rt></ruby>' },
                { word: '摩訶', ruby: '<ruby>摩<rt>ㄇㄛˊ</rt></ruby><ruby>訶<rt>ㄏㄜ</rt></ruby>' },
                { word: '揭諦', ruby: '<ruby>揭<rt>ㄐㄧㄝ</rt></ruby><ruby>諦<rt>ㄉㄧˋ</rt></ruby>' },
                { word: '波羅蜜多', ruby: '<ruby>波<rt>ㄅㄛ</rt></ruby><ruby>羅<rt>ㄌㄨㄛˊ</rt></ruby><ruby>蜜<rt>ㄇㄧˋ</rt></ruby><ruby>多<rt>ㄉㄨㄛ</rt></ruby>' },
                { word: '菩提娑婆訶', ruby: '<ruby>菩<rt>ㄆㄨˊ</rt></ruby><ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>娑<rt>ㄙㄨㄛ</rt></ruby><ruby>婆<rt>ㄆㄛˊ</rt></ruby><ruby>訶<rt>ㄏㄜ</rt></ruby>' },
                { word: '阿耨多羅', ruby: '<ruby>阿<rt>ㄚ</rt></ruby><ruby>耨<rt>ㄋㄡˋ</rt></ruby><ruby>多<rt>ㄉㄨㄛ</rt></ruby><ruby>羅<rt>ㄌㄨㄛˊ</rt></ruby>' },
                { word: '三藐三菩提', ruby: '<ruby>三<rt>ㄙㄢ</rt></ruby><ruby>藐<rt>ㄇㄧㄠˇ</rt></ruby><ruby>三<rt>ㄙㄢ</rt></ruby><ruby>菩<rt>ㄆㄨˊ</rt></ruby><ruby>提<rt>ㄊㄧˊ</rt></ruby>' },
                { word: '菩提薩埵', ruby: '<ruby>菩<rt>ㄆㄨˊ</rt></ruby><ruby>提<rt>ㄊㄧˊ</rt></ruby><ruby>薩<rt>ㄙㄚˋ</rt></ruby><ruby>埵<rt>ㄉㄨㄛˇ</rt></ruby>' },
                { word: '栴檀', ruby: '<ruby>栴<rt>ㄓㄢ</rt></ruby><ruby>檀<rt>ㄊㄢˊ</rt></ruby>' },
                { word: '龕室', ruby: '<ruby>龕<rt>ㄎㄢ</rt></ruby>室' },
                { word: '勅諸', ruby: '<ruby>勅<rt>ㄔˋ</rt></ruby>諸' },
                { word: '雨無量香華', ruby: '<ruby>雨<rt>ㄩˋ</rt></ruby>無量香華' }
            ];

            let result = text;
            annotations.forEach(item => {
                result = result.split(item.word).join(item.ruby);
            });
            return result;
        }

        // 計算頂部固定欄位高度，用於精準滾動補償（避免標題被上方 Header 與章節導航條遮擋）
        function getHeaderOffset() {
            // app-header (54px) + scripture-quick-bar (42px) + scripture-section-bar (38px) = 134px + 12px 留白
            return 146;
        }

        // 切換經典
        function switchScripture(sutraId) {
            if (state.isAutoScrolling) {
                stopAutoScroll();
            }
            renderScripture(sutraId);
            window.scrollTo({ top: 0, behavior: 'auto' });
            showToast(`已切換至《${SCRIPTURES_DATA[sutraId].title}》`);
            closeAllDrawers();
        }

        // 同步目錄抽屜（下拉選單）經典標籤選中狀態
        function updateTocScripturePills(sutraId) {
            document.querySelectorAll('.toc-s-pill').forEach(p => {
                p.classList.toggle('active', p.dataset.sutra === sutraId);
            });
        }

        // 抽屜內切換經典目錄分頁
        function switchScriptureInDrawer(sutraId) {
            state.drawerSutraId = sutraId;
            updateTocScripturePills(sutraId);
            renderTocDrawer();
        }

        // 快速跳轉至地藏經某卷
        function scrollToRoll(rollId) {
            const el = document.getElementById(rollId);
            if (el) {
                const offset = getHeaderOffset();
                const targetY = Math.max(0, el.getBoundingClientRect().top + window.scrollY - offset);

                if (state.isAutoScrolling) {
                    window.scrollTo({ top: targetY, behavior: 'auto' });
                    lastScrollTimestamp = performance.now();
                    scrollFractionAccumulator = 0;
                } else {
                    window.scrollTo({ top: targetY, behavior: 'smooth' });
                }
                updateRollPillActive(rollId);
            }
        }

        function updateRollPillActive(rollId) {
            document.querySelectorAll('.roll-tab-pill').forEach(pill => {
                pill.classList.toggle('active', pill.id === 'pill-' + rollId);
            });
        }

        // 渲染目錄抽屜清單
        function renderTocDrawer() {
            const sutraId = state.drawerSutraId || state.currentSutraId;
            const data = SCRIPTURES_DATA[sutraId];
            const container = document.getElementById('tocListContainer');
            if (!container || !data) return;

            // 確保上方標籤選中狀態與即將渲染的章節內容一致
            updateTocScripturePills(sutraId);

            let html = '';

            if (sutraId === 'dizang') {
                data.rolls.forEach(roll => {
                    html += `
                        <div class="toc-roll-group">
                            <div class="toc-roll-title">
                                <span>✦</span> ${roll.title}（${roll.desc}）
                            </div>
                    `;
                    roll.chapters.forEach(chap => {
                        const isCur = (state.currentSutraId === 'dizang' && state.currentChapterTitle === chap.title);
                        html += `
                            <div class="toc-item ${isCur ? 'active' : ''}" onclick="handleTocClick('${sutraId}', '${chap.id}')">
                                <div>
                                    <div class="toc-item-title">${chap.title}</div>
                                </div>
                                <span class="toc-item-badge">點選跳轉 ➔</span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                });
            } else {
                html += `<div class="toc-roll-group">`;
                data.chapters.forEach(chap => {
                    const isCur = (state.currentSutraId === sutraId && state.currentChapterTitle === chap.title);
                    html += `
                        <div class="toc-item ${isCur ? 'active' : ''}" onclick="handleTocClick('${sutraId}', '${chap.id}')">
                            <div>
                                <div class="toc-item-title">${chap.title}</div>
                            </div>
                            <span class="toc-item-badge">點選跳轉 ➔</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // 點擊目錄項目處理
        function handleTocClick(sutraId, chapId) {
            if (state.currentSutraId !== sutraId) {
                if (state.isAutoScrolling) {
                    stopAutoScroll();
                }
                renderScripture(sutraId);
                setTimeout(() => {
                    jumpToChapter(chapId);
                }, 120);
            } else {
                jumpToChapter(chapId);
            }
        }

        // 跳轉到具體章節品名
        function jumpToChapter(chapId) {
            const el = document.getElementById(chapId);
            if (el) {
                closeAllDrawers();
                const offset = getHeaderOffset();
                const targetY = Math.max(0, el.getBoundingClientRect().top + window.scrollY - offset);

                if (state.isAutoScrolling) {
                    window.scrollTo({ top: targetY, behavior: 'auto' });
                    lastScrollTimestamp = performance.now();
                    scrollFractionAccumulator = 0;
                } else {
                    window.scrollTo({ top: targetY, behavior: 'smooth' });
                }

                const title = el.dataset.title || '章節';
                showToast(`已跳轉至「${title}」`);
                updateHeaderTitle(`${SCRIPTURES_DATA[state.currentSutraId].shortTitle || SCRIPTURES_DATA[state.currentSutraId].title} · ${title}`);
            }
        }

        // 滾動監聽（進度條與歷史儲存）
        function setupScrollListener() {
            let scrollTimer = null;
            window.addEventListener('scroll', () => {
                const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                if (totalHeight > 0) {
                    const percent = Math.min(100, Math.max(0, (window.scrollY / totalHeight) * 100));
                    document.getElementById('readingProgressBar').style.width = percent + '%';
                }

                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(() => {
                    localStorage.setItem('sutra_scroll_' + state.currentSutraId, window.scrollY);
                }, 500);
            }, { passive: true });
        }

        // IntersectionObserver 追蹤當前卷與品目
        let sectionObserver = null;
        function setupIntersectionObserver() {
            if (sectionObserver) sectionObserver.disconnect();

            sectionObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const rollId = entry.target.dataset.roll;
                        const chapTitle = entry.target.dataset.title;
                        const chapBadge = entry.target.dataset.badge;
                        const chapId = entry.target.id;

                        if (rollId) {
                            updateRollPillActive(rollId);
                        }
                        if (chapTitle) {
                            state.currentChapterTitle = chapTitle;
                            const short = SCRIPTURES_DATA[state.currentSutraId].shortTitle || SCRIPTURES_DATA[state.currentSutraId].title;
                            updateHeaderTitle(`${short} · ${chapBadge || chapTitle}`);
                        }

                        // 即時同步高亮頂部通用章節區塊膠囊列，並平滑滾動至可視中央
                        if (chapId) {
                            document.querySelectorAll('.section-pill-btn').forEach(btn => {
                                btn.classList.toggle('active', btn.id === 'sec-pill-' + chapId);
                            });
                            const activeBtn = document.getElementById('sec-pill-' + chapId);
                            if (activeBtn) {
                                activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                            }
                        }
                    }
                });
            }, { rootMargin: '-10% 0px -70% 0px' });

            document.querySelectorAll('.chapter-section').forEach(sec => sectionObserver.observe(sec));
        }

        // 念誦速度檔位設定 (單位: 像素/秒, 精準考量字字持誦讀速，基於時間戳記計算，不受 60Hz/120Hz 影響)
        // 經文一行約 50px，1 行約 14~18 字
        const SCROLL_SPEEDS = [
            { level: 1, pxPerSec: 3.5, label: '極緩・一字一磬 (約14秒/行)' },
            { level: 2, pxPerSec: 6.5, label: '緩速・隨文入觀 (約8秒/行)' },
            { level: 3, pxPerSec: 12.0, label: '中速・日常持誦 (約4秒/行)' },
            { level: 4, pxPerSec: 22.0, label: '流暢・熟誦如流 (約2.3秒/行)' },
            { level: 5, pxPerSec: 38.0, label: '快讀・目視檢索 (約1.3秒/行)' }
        ];

        let lastScrollTimestamp = 0;
        let scrollFractionAccumulator = 0;

        // 停止自動滾動
        function stopAutoScroll() {
            if (!state.isAutoScrolling) return;
            state.isAutoScrolling = false;
            const btn = document.getElementById('btnToggleAutoScroll');
            const icon = document.getElementById('autoScrollIcon');
            const panel = document.getElementById('autoScrollPanel');
            if (btn) btn.classList.remove('primary');
            if (panel) panel.classList.remove('show');
            if (icon) icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
            if (state.autoScrollRafId) {
                cancelAnimationFrame(state.autoScrollRafId);
                state.autoScrollRafId = null;
            }
        }

        // 自動平穩滾動開關
        function toggleAutoScroll() {
            if (state.isAutoScrolling) {
                stopAutoScroll();
                showToast('已暫停自動滾動');
            } else {
                state.isAutoScrolling = true;
                const btn = document.getElementById('btnToggleAutoScroll');
                const icon = document.getElementById('autoScrollIcon');
                const panel = document.getElementById('autoScrollPanel');
                if (btn) btn.classList.add('primary');
                if (panel) panel.classList.add('show');
                if (icon) icon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                startAutoScrollLoop();
                const speedObj = SCROLL_SPEEDS[state.scrollSpeed - 1] || SCROLL_SPEEDS[0];
                showToast(`已開啟自動滾動：${speedObj.label}`);
            }
        }

        function startAutoScrollLoop() {
            lastScrollTimestamp = performance.now();
            scrollFractionAccumulator = 0;

            function step(timestamp) {
                if (!state.isAutoScrolling) return;

                const dt = Math.min(timestamp - lastScrollTimestamp, 100); // 避免切換分頁回到頁面時突跳
                lastScrollTimestamp = timestamp;

                const speedObj = SCROLL_SPEEDS[state.scrollSpeed - 1] || SCROLL_SPEEDS[0];
                const deltaPx = (speedObj.pxPerSec * dt) / 1000;

                scrollFractionAccumulator += deltaPx;
                if (scrollFractionAccumulator >= 1) {
                    const toMove = Math.floor(scrollFractionAccumulator);
                    window.scrollBy(0, toMove);
                    scrollFractionAccumulator -= toMove;
                }

                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 8) {
                    toggleAutoScroll();
                    showToast('誦經已圓滿至文末');
                    return;
                }

                state.autoScrollRafId = requestAnimationFrame(step);
            }
            state.autoScrollRafId = requestAnimationFrame(step);
        }

        function adjustScrollSpeed(delta) {
            state.scrollSpeed = Math.max(1, Math.min(SCROLL_SPEEDS.length, state.scrollSpeed + delta));
            const speedObj = SCROLL_SPEEDS[state.scrollSpeed - 1];
            document.getElementById('scrollSpeedText').textContent = `速 ${state.scrollSpeed}`;
            showToast(`念誦速度：速 ${state.scrollSpeed}・${speedObj.label}`);
        }

        // 電子木魚敲擊
        function quickTapMuyu(e) {
            playWoodenFishSound();
            state.muyuCount++;
            updateMuyuDisplay();
            spawnRipple(e.clientX, e.clientY);
        }

        function tapBigMuyu(e) {
            playWoodenFishSound();
            state.muyuCount++;
            updateMuyuDisplay();
            const rect = e.currentTarget.getBoundingClientRect();
            spawnRipple(rect.left + rect.width / 2, rect.top + 20);
        }

        function updateMuyuDisplay() {
            document.getElementById('floatingMuyuBadge').textContent = state.muyuCount;
            document.getElementById('muyuCountDisplay').textContent = state.muyuCount;
            localStorage.setItem('sutra_muyu_count', state.muyuCount);
        }

        function resetMuyuCount() {
            if (confirm('確定要將今日持誦敲擊次數重設為 0 嗎？')) {
                state.muyuCount = 0;
                updateMuyuDisplay();
                showToast('已重設念誦計數');
            }
        }

        // 自動定速敲木魚（每1.5秒一聲伴念）
        function toggleAutoMuyu() {
            const btn = document.getElementById('btnAutoMuyu');
            if (state.autoMuyuTimer) {
                clearInterval(state.autoMuyuTimer);
                state.autoMuyuTimer = null;
                btn.style.background = '';
                btn.style.color = '';
                showToast('已停止木魚定速伴念');
            } else {
                playWoodenFishSound();
                state.muyuCount++;
                updateMuyuDisplay();
                state.autoMuyuTimer = setInterval(() => {
                    playWoodenFishSound();
                    state.muyuCount++;
                    updateMuyuDisplay();
                }, 1500);
                btn.style.background = 'var(--accent)';
                btn.style.color = '#FFFFFF';
                showToast('已開啟定速伴念（每1.5秒）');
            }
        }

        // 浮動文字漣漪動畫
        function spawnRipple(x, y) {
            const el = document.createElement('div');
            el.className = 'ripple-text';
            const phrases = ['功德 +1', '得清靜 +1', '吉祥圓滿 +1', '福慧增廣 +1', '心生法喜 +1'];
            el.textContent = phrases[Math.floor(Math.random() * phrases.length)];
            el.style.left = (x || (window.innerWidth / 2)) + 'px';
            el.style.top = (y || (window.innerHeight - 80)) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 850);
        }

        // 沉浸專注模式
        function toggleZenMode() {
            state.isZenMode = !state.isZenMode;
            document.body.classList.toggle('zen-mode', state.isZenMode);
            if (state.isZenMode) {
                showToast('進入沉浸專注閱讀（右上角可退出）');
            } else {
                showToast('已恢復工具欄');
            }
        }

        // 主題切換
        function setTheme(themeName, save = true) {
            const themes = ['theme-ricepaper', 'theme-dark', 'theme-bamboo', 'theme-moonwhite'];
            themes.forEach(t => document.body.classList.remove(t));
            document.body.classList.add(themeName);
            state.theme = themeName;
            if (save) localStorage.setItem('sutra_theme', themeName);

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.classList.contains('theme-btn-' + themeName.replace('theme-', '')));
            });
        }

        // 字體大小步進調整（放大再放大）
        function stepFontSize(delta) {
            const cur = parseInt(state.fontSize, 10) || 24;
            const next = Math.max(16, Math.min(44, cur + delta));
            changeFontSize(next);
            showToast(`字體已調整為 ${next}px`);
        }

        // 字體大小設定
        function changeFontSize(val, save = true) {
            const num = parseInt(val, 10) || 24;
            state.fontSize = num;
            document.documentElement.style.setProperty('--font-size', num + 'px');
            const display = document.getElementById('fontSizeDisplay');
            if (display) display.textContent = num + 'px';
            const slider = document.getElementById('fontSizeSlider');
            if (slider) slider.value = num;

            // 更新預設按鈕高亮
            document.querySelectorAll('.font-preset-pill').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`(${num})`));
            });

            if (save) localStorage.setItem('sutra_fontsize', num);
        }

        // 行距
        function setLineHeight(val, save = true) {
            state.lineHeight = val;
            document.documentElement.style.setProperty('--line-height', val);
            if (save) localStorage.setItem('sutra_lineheight', val);

            document.querySelectorAll('#lh-18, #lh-21, #lh-24').forEach(btn => {
                btn.classList.toggle('active', btn.id === 'lh-' + val.replace('.', ''));
            });
        }

        // 排版方向 (橫排 / 直排)
        function setLayout(layoutType, save = true) {
            state.layout = layoutType;
            const container = document.getElementById('readerContainer');
            if (layoutType === 'vertical') {
                container.classList.add('reading-vertical');
                document.getElementById('layout-vertical').classList.add('active');
                document.getElementById('layout-horizontal').classList.remove('active');
                showToast('已切換為古風直排卷軸（可向左滑動）');
            } else {
                container.classList.remove('reading-vertical');
                document.getElementById('layout-horizontal').classList.add('active');
                document.getElementById('layout-vertical').classList.remove('active');
            }
            if (save) localStorage.setItem('sutra_layout', layoutType);
        }

        // 字體風格
        function setFontFamily(fontType, save = true) {
            state.fontFamily = fontType;
            let family = "'Noto Serif TC', 'Songti TC', serif";
            if (fontType === 'kaiti') {
                family = "'LXGW WenKai TC', 'KaiTi', cursive, serif";
            } else if (fontType === 'sans') {
                family = "'Noto Sans TC', sans-serif";
            }
            document.documentElement.style.setProperty('--font-family', family);
            if (save) localStorage.setItem('sutra_font', fontType);

            document.querySelectorAll('#font-serif, #font-kaiti, #font-sans').forEach(btn => {
                btn.classList.toggle('active', btn.id === 'font-' + fontType);
            });
        }

        // 保持螢幕常亮 (Screen Wake Lock API)
        async function toggleWakeLock(enabled) {
            if (enabled) {
                try {
                    if ('wakeLock' in navigator) {
                        state.wakeLock = await navigator.wakeLock.request('screen');
                        showToast('已開啟螢幕常亮（不滅屏）');
                    } else {
                        showToast('您的瀏覽器不支援螢幕常亮');
                    }
                } catch (err) {
                    console.warn('Wake Lock error:', err);
                }
            } else {
                if (state.wakeLock) {
                    await state.wakeLock.release();
                    state.wakeLock = null;
                    showToast('已關閉螢幕常亮');
                }
            }
        }

        // 顯示/隱藏生僻字注音
        function togglePinyin(show) {
            state.showPinyin = show;
            document.body.classList.toggle('hide-pinyin', !show);
        }

        // 經文搜尋功能
        function toggleSearchBar() {
            const bar = document.getElementById('searchBarModal');
            bar.classList.toggle('show');
            if (bar.classList.contains('show')) {
                document.getElementById('searchKeyword').focus();
            } else {
                clearSearchHighlights();
            }
        }

        function executeSearch() {
            const kw = document.getElementById('searchKeyword').value.trim();
            if (!kw) return;

            clearSearchHighlights();

            const area = document.getElementById('scriptureContentArea');
            const regex = new RegExp(`(${kw})`, 'gi');
            let count = 0;

            const walker = document.createTreeWalker(area, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                if (walker.currentNode.parentNode.nodeName !== 'SCRIPT' && walker.currentNode.parentNode.nodeName !== 'STYLE') {
                    textNodes.push(walker.currentNode);
                }
            }

            textNodes.forEach(node => {
                if (regex.test(node.nodeValue)) {
                    const span = document.createElement('span');
                    span.innerHTML = node.nodeValue.replace(regex, '<mark class="sutra-highlight">$1</mark>');
                    node.parentNode.replaceChild(span, node);
                    count++;
                }
            });

            document.getElementById('searchMatchCount').textContent = count > 0 ? `共 ${count} 處` : '未找到匹配';
            const firstMark = document.querySelector('mark.sutra-highlight');
            if (firstMark) {
                const offset = getHeaderOffset() + 40;
                const targetY = Math.max(0, firstMark.getBoundingClientRect().top + window.scrollY - offset);
                if (state.isAutoScrolling) {
                    window.scrollTo({ top: targetY, behavior: 'auto' });
                    lastScrollTimestamp = performance.now();
                    scrollFractionAccumulator = 0;
                } else {
                    firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function clearSearchHighlights() {
            document.querySelectorAll('mark.sutra-highlight').forEach(mark => {
                const parent = mark.parentNode;
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
                parent.normalize();
            });
            document.getElementById('searchMatchCount').textContent = '';
        }

        // 抽屜面板控制
        function openTocDrawer() {
            closeAllDrawers();
            // 每次打開目錄抽屜（下拉選單），強制同步為當前主畫面正在閱讀的經典
            state.drawerSutraId = state.currentSutraId;
            updateTocScripturePills(state.currentSutraId);
            document.getElementById('tocDrawer').classList.add('open');
            document.getElementById('drawerBackdrop').classList.add('open');
            renderTocDrawer();
        }

        function openSettingsDrawer() {
            closeAllDrawers();
            document.getElementById('settingsDrawer').classList.add('open');
            document.getElementById('drawerBackdrop').classList.add('open');
        }

        function openMuyuModal() {
            closeAllDrawers();
            document.getElementById('muyuDrawer').classList.add('open');
            document.getElementById('drawerBackdrop').classList.add('open');
        }

        function closeAllDrawers() {
            document.querySelectorAll('.drawer-panel').forEach(el => el.classList.remove('open'));
            document.getElementById('drawerBackdrop').classList.remove('open');
        }

        // Toast 輕提示
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('appToast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2100);
        }
    </script>
</body>
</html>
